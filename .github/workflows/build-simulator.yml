name: Build iOS Simulator App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ITGSBrabioGantt.xcodeproj \
            -scheme ITGSBrabioGantt \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Debug-iphonesimulator/ITGSBrabioGantt.app \
            ITGSBrabioGantt-Simulator.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITGSBrabioGantt-Simulator
          path: ITGSBrabioGantt-Simulator.zip
          if-no-files-found: error
